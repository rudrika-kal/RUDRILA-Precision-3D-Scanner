name: Build RUDRILA 3D Scanner APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q RUDRILA-Precision-3D-Scanner-GITHUB-READY.zip

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      

      - name: Install Android 36
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: RUDRILA-Precision-3D-Scanner/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RUDRILA-Precision-3D-Scanner-APK
          path: RUDRILA-Precision-3D-Scanner/android/app/build/outputs/apk/debug/app-debug.apk
